<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs></defs>
<rect x="1" y="1" width="998" height="418" rx="22" fill="#FFFBF5" stroke="#EADFF5" stroke-width="2"/>
<text x="500.0" y="62" text-anchor="middle" font-size="40" font-weight="900" fill="#2D2A4A"><tspan fill="#E8577E">f</tspan> = <tspan fill="#E09B00">g</tspan> + <tspan fill="#2A9BC4">h</tspan></text>
<rect x="40" y="110" width="170" height="210" rx="18" fill="#FFD6E0"/><text x="125" y="160" text-anchor="middle" font-size="30" font-weight="900" fill="#E8577E">f(n)</text>
<text x="125" y="215" text-anchor="middle" font-size="18" fill="#2D2A4A">priority score</text>
<text x="125" y="245" text-anchor="middle" font-size="18" fill="#2D2A4A">lowest goes</text>
<text x="125" y="275" text-anchor="middle" font-size="18" fill="#2D2A4A">first 🥇</text>
<rect x="230" y="110" width="170" height="210" rx="18" fill="#FFF1C9"/><text x="315" y="160" text-anchor="middle" font-size="30" font-weight="900" fill="#E09B00">g(n)</text>
<text x="315" y="215" text-anchor="middle" font-size="18" fill="#2D2A4A">moves made</text>
<text x="315" y="245" text-anchor="middle" font-size="18" fill="#2D2A4A">so far</text>
<text x="315" y="275" text-anchor="middle" font-size="18" fill="#2D2A4A">(the depth)</text>
<rect x="420" y="110" width="170" height="210" rx="18" fill="#DDF3FB"/><text x="505" y="160" text-anchor="middle" font-size="30" font-weight="900" fill="#2A9BC4">h(n)</text>
<text x="505" y="215" text-anchor="middle" font-size="18" fill="#2D2A4A">how far every tile</text>
<text x="505" y="245" text-anchor="middle" font-size="18" fill="#2D2A4A">is from home</text>
<text x="505" y="275" text-anchor="middle" font-size="18" fill="#2D2A4A">(Manhattan)</text>
<rect x="650" y="110" width="218" height="218" rx="16" fill="#EFEAF7"/>
<rect x="660" y="120" width="62" height="62" rx="12" fill="#FFFFFF"/>
<rect x="728" y="120" width="62" height="62" rx="12" fill="#FFFFFF"/>
<rect x="796" y="120" width="62" height="62" rx="12" fill="#FFFFFF"/>
<rect x="660" y="188" width="62" height="62" rx="12" fill="#FFFFFF"/>
<rect x="728" y="188" width="62" height="62" rx="12" fill="#FFFFFF"/>
<rect x="796" y="188" width="62" height="62" rx="12" fill="#FFFFFF"/>
<rect x="660" y="256" width="62" height="62" rx="12" fill="#FFFFFF"/>
<rect x="728" y="256" width="62" height="62" rx="12" fill="#FFFFFF"/>
<rect x="796" y="256" width="62" height="62" rx="12" fill="#FFFFFF"/>
<rect x="731" y="259" width="56" height="56" rx="10" fill="none" stroke="#A0C4FF" stroke-width="3" stroke-dasharray="6 5"/><text x="759.0" y="309" text-anchor="middle" font-size="12" font-weight="700" fill="#8A84B0">home</text>
<path d="M691.0 173.0 L691.0 287.0 L735.0 287.0" fill="none" stroke="#2A9BC4" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/>
<circle cx="691.0" cy="219.0" r="13" fill="#2A9BC4"/><text x="691.0" y="224.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text>
<circle cx="691.0" cy="287.0" r="13" fill="#2A9BC4"/><text x="691.0" y="292.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text>
<circle cx="725.0" cy="287.0" r="13" fill="#2A9BC4"/><text x="725.0" y="292.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text>
<rect x="660" y="120" width="62" height="62" rx="12" fill="#A0C4FF"/><text x="691.0" y="161.0" text-anchor="middle" font-size="28" font-weight="800" fill="#2D2A4A">7</text>
<text x="759.0" y="364" text-anchor="middle" font-size="18" fill="#2D2A4A">tile 7 is <tspan font-weight="800" fill="#2A9BC4">2 down + 1 right = 3</tspan> away</text>
<text x="759.0" y="388" text-anchor="middle" font-size="15" fill="#5B5680">h(n) adds this up for every tile</text>
</svg>
